# 引用した主張が姉妹リポジトリで言い換えられていないかを、週 1 回まとめて確認する。
#
# **PR の検査に置いていない。** 失敗の原因は相手の編集で、こちらの diff とは無関係である。
# そして登録の 6 割が 1 ファイル（perf-matrix-results.md）に集まっているので、相手がそのファイルを
# 書き換えると無関係な変更がまとめて止まる。**その形は「赤を無視する」側に倒れる。**
# 形が変わったら判断も変わる。数値は `make outgoing-probes` が
# `shape: N registration(s) across M file(s), K in the largest` として毎回出す。
#
# 逆方向（姉妹がこちらから引いた文が、こちらの編集で消えていないか）は ci.yml のブロッキング側にある。
name: Cited claims

on:
  schedule:
    # 毎週月曜 00:20 UTC
    - cron: "20 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outgoing-probes:
    name: Cited claims in sibling repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # 引用先を 1 つでも置き忘れると、その登録は検査されないまま緑になる。だから `--strict` で
      # スキップと作業ツリーへのフォールバックを失敗として扱う。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Yoshiki0705/S3-Burst-on-ONTAP-Files
          path: siblings/S3-Burst-on-ONTAP-Files
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Yoshiki0705/FSx-for-ONTAP-Adoption-Playbook
          path: siblings/FSx-for-ONTAP-Adoption-Playbook
          persist-credentials: false

      - name: Cited claims in sibling repositories
        env:
          SIBLING_ROOT: siblings
          OUTGOING_PROBE_FLAGS: --strict
        run: make outgoing-probes
