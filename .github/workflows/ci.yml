name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every step below calls a Makefile target. Path lists live in Makefile
  # variables and tool versions in requirements-dev.txt, so CI and a local run
  # cannot inspect different trees with different tools.
  gates:
    name: Gates (ruff / pytest / cfn-lint / bandit / drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned tooling
        run: make install

      - name: Report resolved tool versions
        run: make tools

      - name: Ruff lint
        run: make lint

      - name: Ruff format check
        run: make format-check

      # The repository-name tests resolve sibling names against the GitHub API.
      # They skip when the API cannot answer, so the job stays green without a
      # token — but a skipped test protects nothing, and the anonymous allowance
      # is 60 requests an hour per IP on shared runners. The token costs no extra
      # permission beyond the read-only `contents` above.
      - name: Pytest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make test

      - name: CloudFormation lint
        run: make cfn-lint

      - name: Bandit (Medium and above)
        run: make security

      # The target runs the detector's own selftest first, so a rule that stopped
      # matching fails the job instead of reporting an empty result as a pass.
      - name: Japanese heading style (noun phrases)
        run: make headings
      # Same shape: the selftest runs first, so a rule that stopped matching
      # fails the job rather than reporting an empty result as a pass.
      - name: Role-name labels on notes and headings
        run: make role-labels

      # The steps in this job must be exactly the prerequisites of `make gates`,
      # and scripts/tests/test_ci_gate_parity.py fails the build when they are
      # not. The three diagram gates below were missing for months: the Makefile
      # said they were in `drift` so that "CI runs them always", but this file
      # never invoked `drift` — it invoked `context-budget` alone. Nothing checked
      # the claim, so the comment stayed true-looking and the gates never ran.
      #
      # `agent-config` stays out: it calls a validator under ~/.kiro, which does
      # not exist on a runner. That is why `ci` is `gates` plus that one target
      # rather than `gates` being the whole of `ci`.
      - name: Context budget (AGENTS.md size, loader thinness, index reachability)
        run: make context-budget

      - name: Diagram artefact consistency
        run: make diagram-assets

      - name: Diagram label readability floor
        run: make diagram-fonts

      - name: Diagram reading direction
        run: make diagram-flow

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: scripts
          severity: warning

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@fa0cd0f1a052f54da593c83860f2292982f5d142 # v23.2.0
        with:
          globs: |
            docs/**/*.md
            README.md
          config: .markdownlint.json
