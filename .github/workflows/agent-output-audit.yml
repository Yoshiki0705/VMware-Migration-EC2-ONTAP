name: Agent Output Audit

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.yaml'
      - '**.yml'
      - '**.py'
      - '**.sql'
      - '**.json'
      - '**.sh'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '**.yaml'
      - '**.yml'
      - '**.py'
      - '**.sql'
      - '**.json'
      - '**.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-output-audit:
    name: Naming / Neutrality / Leak / Parity
    runs-on: ubuntu-latest
    env:
      PROJECT_CONTEXT_NAMES: ${{ secrets.PROJECT_CONTEXT_NAMES }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi

          if [ -n "$BASE" ]; then
            ALL_CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD 2>/dev/null || echo "")
          else
            ALL_CHANGED=$(git ls-files)
          fi

          # Exclude infrastructure/meta files
          FILTERED=$(echo "$ALL_CHANGED" | grep -vE '^(\.github/|AGENTS\.md|CONTRIBUTING|\.kiro/)' || true)

          # Split into md and text lists
          MD_FILES=$(echo "$FILTERED" | grep -E '\.md$' || true)
          TEXT_FILES=$(echo "$FILTERED" | grep -E '\.(md|yaml|yml|py|sql|json|sh)$' || true)

          # Write to files for subsequent steps
          echo "$MD_FILES" > /tmp/changed_md.txt
          echo "$TEXT_FILES" > /tmp/changed_text.txt

          # Summary
          MD_COUNT=$(echo "$MD_FILES" | grep -c '.' 2>/dev/null || true)
          : "${MD_COUNT:=0}"
          TEXT_COUNT=$(echo "$TEXT_FILES" | grep -c '.' 2>/dev/null || true)
          : "${TEXT_COUNT:=0}"
          echo "md_count=$MD_COUNT" >> "$GITHUB_OUTPUT"
          echo "text_count=$TEXT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed: $MD_COUNT md, $TEXT_COUNT text files"

      - name: "Check: Naming standards (changed .md)"
        if: steps.changed.outputs.md_count != '0'
        run: |
          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            # Exclude lines with allow:naming comment
            HITS=$(grep -nE '\bFSxN\b|FSx ONTAP|FSx S3 AP' "$file" | grep -v 'allow:naming' || true)
            if [ -n "$HITS" ]; then
              echo "::error file=$file::Naming violation found"
              echo "$HITS" | while IFS= read -r line; do
                LINENUM=$(echo "$line" | cut -d: -f1)
                echo "  $file:$LINENUM"
              done
              FAIL=1
            fi
          done < /tmp/changed_md.txt

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Naming check failed. Use 'FSx for ONTAP' (not FSxN/FSx ONTAP/FSx S3 AP)."
            exit 1
          fi
          echo "✅ Naming check passed"

      - name: "Check: Forbidden tools (changed .md)"
        if: steps.changed.outputs.md_count != '0'
        run: |
          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            # Same allow:naming escape as the naming check. A document that
            # states which products not to propose, and a verbatim citation
            # title, both have to name them.
            HITS=$(grep -nE 'Workload Factory|NetApp Console|BlueXP' "$file" | grep -v 'allow:naming' || true)
            if [ -n "$HITS" ]; then
              echo "::error file=$file::Forbidden tool reference found"
              echo "$HITS" | while IFS= read -r line; do
                LINENUM=$(echo "$line" | cut -d: -f1)
                echo "  $file:$LINENUM"
              done
              FAIL=1
            fi
          done < /tmp/changed_md.txt

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Forbidden tools found. Replace with native equivalents (CloudWatch, ONTAP REST API, etc.)."
            exit 1
          fi
          echo "✅ Forbidden tools check passed"

      - name: "Check: Vendor neutrality (changed .md)"
        if: steps.changed.outputs.md_count != '0'
        run: |
          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            # Same allow:naming escape: the document that forbids these phrases
            # has to quote them.
            HITS=$(grep -nE '最強|game-changer|ゲームチェンジャー|競合ツール|優位性|より優れ|is better than|is superior to' "$file" | grep -v 'allow:naming' || true)
            if [ -n "$HITS" ]; then
              echo "::error file=$file::Vendor neutrality violation found"
              echo "$HITS" | while IFS= read -r line; do
                LINENUM=$(echo "$line" | cut -d: -f1)
                echo "  $file:$LINENUM"
              done
              FAIL=1
            fi
          done < /tmp/changed_md.txt

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Neutrality check failed. Use right-tool-for-the-job framing."
            exit 1
          fi
          echo "✅ Vendor neutrality check passed"

      - name: "Check: Leak detection (changed text)"
        if: steps.changed.outputs.text_count != '0'
        run: |
          # Build pattern from secret + static patterns
          PATTERN='DB-I-[0-9]+'
          if [ -n "$PROJECT_CONTEXT_NAMES" ]; then
            PATTERN="$PROJECT_CONTEXT_NAMES|$PATTERN"
          fi

          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            HITS=$(grep -nE "$PATTERN" "$file" || true)
            if [ -n "$HITS" ]; then
              # Output file:line only — never echo match content
              echo "$HITS" | cut -d: -f1,2 | while IFS= read -r loc; do
                echo "::error file=$file,line=$(echo "$loc" | cut -d: -f1)::Potential leak detected"
              done
              FAIL=1
            fi
          done < /tmp/changed_text.txt

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Leak check failed. Remove personal names, internal IDs, or case numbers."
            exit 1
          fi
          echo "✅ Leak detection passed"

      # A vendor's support reply is the vendor's confidential information, so it cannot be the
      # published basis for a claim -- however it is worded, because what is confidential is the
      # content and not the wording. Asking, the date, and filing a request stay publishable.
      #
      # The rule lives in the Adoption Playbook rather than being copied here. It was corrected
      # seven times in one day, every time by running it over a repository it had not seen, and a
      # copy in each repository would mean several repositories to update with no way to tell
      # which had fallen behind. So this tracks `main` deliberately, against the usual rule of
      # pinning: pinning would freeze the rule at whichever revision was current when this file
      # was written, which for a detector still finding new shapes is the failure mode rather
      # than the protection. It is a repository under the same owner, and it is read-only here.
      #
      # `--only` because a repository can be clean on this rule while carrying a backlog in
      # another category: without it the run fails on the backlog and this rule's result is
      # invisible inside it.
      - name: "Checkout the canonical audit rule"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Yoshiki0705/FSx-for-ONTAP-Adoption-Playbook
          ref: main
          path: .canonical-audit
          sparse-checkout: tools
          persist-credentials: false
      - name: "Check: Support attribution (whole tree, not just changed files)"
        run: |
          # Whole tree on purpose. This is not style debt that can ratchet down -- an
          # attribution already published is already published, and a file nobody touched is
          # exactly where one survives.
          python3 .canonical-audit/tools/audit_public_output.py \
            --path . --only support-attribution
      - name: "Check: JA/EN parity (warning only)"
        if: steps.changed.outputs.md_count != '0'
        run: |
          # For each changed JA doc, check if corresponding EN doc has matching heading count
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            if echo "$file" | grep -q 'docs/ja/'; then
              EN_FILE=$(echo "$file" | sed 's|docs/ja/|docs/en/|')
              if [ -f "$EN_FILE" ]; then
                JA_HEADINGS=$(grep -c '^##' "$file" || echo "0")
                EN_HEADINGS=$(grep -c '^##' "$EN_FILE" || echo "0")
                if [ "$JA_HEADINGS" -ne "$EN_HEADINGS" ]; then
                  echo "::warning file=$file::JA/EN parity mismatch: JA has $JA_HEADINGS h2 headings, EN has $EN_HEADINGS"
                fi
              else
                echo "::warning file=$file::No corresponding EN file found at $EN_FILE"
              fi
            fi
          done < /tmp/changed_md.txt
          echo "✅ JA/EN parity check complete (warnings only)"
