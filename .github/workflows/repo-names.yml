name: Repository names

# A renamed sibling repository keeps resolving under its old name, so a link
# checker reports every URL reachable and nothing flags it. This repository was
# itself linked by its old name from a sibling for months. Now that README links
# out to that sibling, the same risk runs in the other direction.
#
# Separate from ci.yml because this needs the network. Weekly is enough: names
# change rarely, and a stale one is a slow leak rather than a broken build.
on:
  schedule:
    - cron: '0 5 * * 1' # Weekly Monday 05:00 UTC (after scorecard at 03:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-names:
    name: Resolve every repository name in prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # The target runs the detector's own selftest first, so extraction that
      # stopped matching fails the job instead of reporting an empty result as a
      # pass. The check is stdlib-only, so no dependency install is needed.
      #
      # GITHUB_TOKEN raises the API allowance from 60 requests an hour to 5,000.
      # No permission beyond the read-only `contents` above is required.
      - name: Check repository names
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make repo-names
